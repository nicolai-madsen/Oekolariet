services:
  # SQL Server i stedet for LocalDB (LocalDB virker kun på Windows)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    # Venter, til SQL Server svarer, før api starter
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  # Vores API, bygget fra Dockerfile
  api:
    build:
      context: .
      dockerfile: src/Oekolariet.Api/Dockerfile
    environment:
      # Development: kører migrationer og seed ved opstart
      ASPNETCORE_ENVIRONMENT: Development
      # Overskriver ConnectionStrings:Oekolariet i appsettings
      ConnectionStrings__Oekolariet: "Server=db;Database=Oekolariet;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:8080" # PC:container
    depends_on:
      db:
        condition: service_healthy